version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: scheduler
      POSTGRES_PASSWORD: scheduler
      POSTGRES_DB: job_scheduler
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U scheduler -d job_scheduler']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://scheduler:scheduler@postgres:5432/job_scheduler?schema=public
      JWT_SECRET: dev-jwt-secret-change-in-production
      JWT_EXPIRES_IN: 24h
      PORT: 3000
      NODE_ENV: production
      API_BASE_URL: http://api:3000
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: sh -c "npm run db:migrate && node dist/workers/index.js"
    environment:
      DATABASE_URL: postgresql://scheduler:scheduler@postgres:5432/job_scheduler?schema=public
      JWT_SECRET: dev-jwt-secret-change-in-production
      API_BASE_URL: http://api:3000
      WORKER_HEARTBEAT_INTERVAL_MS: 5000
      WORKER_POLL_INTERVAL_MS: 1000
      WORKER_MAX_CONCURRENT_JOBS: 5
      WORKER_DEAD_THRESHOLD_SECONDS: 30
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - '5173:80'
    depends_on:
      - api

volumes:
  postgres_data:
